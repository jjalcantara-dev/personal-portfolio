name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: i18n parity (es / en)
        run: npm run i18n:check

      - name: Puzzle levels (single solution, no repeats)
        run: npm run puzzles:verify

      - name: Build
        run: npm run build
